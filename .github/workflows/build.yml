name: Build and publish

on:
  push:
    branches: [main]

env:
  IMAGE: otherview/openclaude-box

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone OpenClaude source
        run: |
          git clone --depth 1 https://github.com/Gitlawb/openclaude.git src/
          cp Dockerfile src/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: otherview
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest
